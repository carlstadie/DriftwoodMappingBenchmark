# Misc
typer-slim = "*"
jsonargparse = "*"
docstring-parser = "*"
annotated-doc = "*"
aenum = "*"
mako = "*"
termcolor = "*"
tensorboardx = "*"

[tasks]
# run model training and evaluation
"U-NetxAE" = "python ./mainUnetxAE.py"
"U-NetxPS" = "python ./mainUnetxPS.py"
"U-NetxS2" = "python ./mainUnetxS2.py"
"Swin-U-NetxAE" = "python ./mainSwinUnetxAE.py"
"Swin-U-NetxPS" = "python ./mainSwinUnetxPS.py"
"Swin-U-NetxS2" = "python ./mainSwinUnetxS2.py"
"TerramindxAE" = "python ./mainTerraMindxAE.py"
"TerramindxPS" = "python ./mainTerraMindxPS.py"
"TerramindxS2" = "python ./mainTerraMindxS2.py"
# run analysis
analyse = "python ./analysis/main.py"
