[workspace]
name = "combined-env"
version = "0.1.0"
description = "Combined environment from env1 (PyTorch/ML) and env2 (PyMC/Geo)"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Python
python = "3.11.*"

# BLAS / Linear Algebra
blas = { version = "*", build = "*mkl*" }
mkl = "*"
mkl-devel = "*"
mkl-include = "*"

# Core scientific stack
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib-base = "*"

# ML / Deep Learning (conda packages)
# PyTorch pinned to a specific CUDA 12.1 build to ensure GPU compatibility
# NOTE: install separately on stable connection with:
#   pixi add --channel pytorch --channel nvidia pytorch torchvision torchaudio "pytorch-cuda=12.1.*" pytorch-mutex torchtriton ffmpeg
# pytorch = { version = ">=2.5.1", channel = "pytorch" }
# torchvision = { channel = "pytorch" }
# torchaudio = { channel = "pytorch" }
# pytorch-cuda = { version = "12.1.*", channel = "pytorch" }
# pytorch-mutex = { version = "*", build = "cuda", channel = "pytorch" }
# torchtriton = { channel = "pytorch" }
# ffmpeg = { channel = "pytorch" }

# CUDA (nvidia channel) - versions resolved by pixi to match pytorch-cuda
# cuda-cudart = { channel = "nvidia" }
# cuda-cupti = { channel = "nvidia" }
# cuda-libraries = { channel = "nvidia" }
# cuda-nvrtc = { channel = "nvidia" }
# cuda-nvtx = { channel = "nvidia" }
# cuda-runtime = { channel = "nvidia" }
# libcublas = { channel = "nvidia" }
# libcufft = { channel = "nvidia" }
# libcurand = { channel = "nvidia" }
# libcusolver = { channel = "nvidia" }
# libcusparse = { channel = "nvidia" }

# Geospatial (conda)
gdal = "*"
geopandas = "*"
fiona = "*"
rasterio = "*"
shapely = "*"
pyproj = "*"
geos = "*"
proj = "*"
rtree = "*"

# Other conda packages
scikit-learn = "*"
joblib = "*"
networkx = "*"
pyyaml = "*"
jinja2 = "*"
markupsafe = "*"
requests = "*"
tqdm = "*"
click = "*"
grpcio = "*"
tensorboard = "*"
tensorboard-data-server = "*"
threadpoolctl = "*"
contourpy = "*"
cycler = "*"
fonttools = "*"
kiwisolver = "*"
pyparsing = "*"
python-dateutil = "*"
pytz = "*"
six = "*"
importlib-metadata = "*"
zipp = "*"
packaging = "*"
colorama = "*"
folium = "*"
branca = "*"
mapclassify = "*"
xyzservices = "*"
munch = "*"
snuggs = "*"
cligj = "*"
click-plugins = "*"
werkzeug = "*"
markdown = "*"
qhull = "*"
snappy = "*"
mpmath = "*"
gmpy2 = "*"
pillow = "*"

[pypi-dependencies]
# PyTorch ecosystem (PyPI)
torchmetrics = "*"
pytorch-lightning = "*"
lightning = "*"
lightning-utilities = "*"
einops = "*"
timm = "*"
kornia = "*"
kornia-rs = "*"
