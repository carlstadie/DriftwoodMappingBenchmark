# Segmentation / Vision
segmentation-models-pytorch = "*"
# efficientnet-pytorch and pretrainedmodels removed - abandoned packages that
# require building from source against torch. Use timm instead:
#   timm.create_model('efficientnet_b0', pretrained=True)
albumentations = "*"
albucore = "*"
opencv-python-headless = "*"
scikit-image = "*"
